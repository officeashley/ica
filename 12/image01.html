<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>画像の練習</title>
  <link rel="stylesheet" href="image01.css">
</head>

<body>
  <h1>画像の幅を指定</h1>
  <figure>
    <img class="thumb01" src="img/200.png" alt="画像200">
  </figure>
  <figure>
    <img class="thumb01" src="img/400.png" alt="画像400">
  </figure>

  <h1>画像の高さを指定</h1>
  <figure>
    <img class="thumb02" src="img/200.png" alt="画像200">
    <img class="thumb02" src="img/400.png" alt="画像400">
  </figure>

  <h1>画像に幅と高さを指定</h1>
  <figure>
    <img class="photo01" src="img/terra.jpg" alt="テラリウム">
  </figure>
  <figure>
    <img class="photo02" src="img/terra.jpg" alt="テラリウム">
  </figure>
</body>

</html>
