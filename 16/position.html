<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>positionプロパティ</title>
  <link rel="stylesheet" href="position.css">
</head>

<body>
  <h1>positionプロパティ</h1> 
  <p>「top」「right」「bottom」「left」の各プロパティが要素の位置を決めます。</p>
  <main class="main">
    <section class="section1">
      <h2>relative:相対位置</h2>
      <div class="group group1">
        <div class="target target1">ターゲット1</div>
      </div>
    </section>
    <section class="section2">
      <h2>absolute:絶対位置</h2>
      <div class="group group2">
        <div class="target target2">ターゲット2</div>
      </div>
    </section>
    <section class="section3">
      <h2>fixed:固定位置</h2>
      <div class="group group3">
        <div class="target target3">ターゲット3</div>
      </div>
    </section>
  </main>
</body>

</html>
