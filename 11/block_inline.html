<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロックボックス・インラインボックス</title>
  <link rel="stylesheet" href="block_inline.css">
</head>

<body>
  <h1>ブロックボックス</h1>
  <div>
    ブロックレベル要素が生成するボックスをブロックボックス、インライン要素が生成するボックスをインラインボックスと呼びます。
    ブロックボックスは、要素全体を1つの長方形として表示されます。
    インラインボックスは、要素を1行ずつ行ボックスにして折り返して表示されます。
  </div>

  <h1>インラインボックス</h1>
  <span>
    ブロックレベル要素が生成するボックスをブロックボックス、インライン要素が生成するボックスをインラインボックスと呼びます。
    ブロックボックスは、要素全体を1つの長方形として表示されます。
    インラインボックスは、要素を1行ずつ行ボックスにして折り返して表示されます。
  </span>
</body>

</html>
