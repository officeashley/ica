<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文書構造を定義する要素</title>
</head>

<body>
  <h1>文書の定義をもっと学ぼう</h1>
  <h2>長い引用文</h2>
  <blockquote>
    <p>
      吾輩は猫である。名前はまだ無い。<br>
      どこで生れたかとんと見当がつかぬ。
    </p>
  </blockquote>
  <p>引用元：<cite>吾輩は猫である</cite></p>

  <h2>あとから内容を追加</h2>
  <p><ins>日付が変更されました。</ins></p>

  <h2>あとから内容を削除</h2>
  <p><del>5月9日</del><ins>変更後：5月10日</ins>に開催します。</p>
</body>

</html>
